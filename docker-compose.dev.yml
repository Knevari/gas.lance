# Docker Compose for local development (database only)
# Use this when developing locally without containerizing the apps

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gaslance-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: gaslance
      POSTGRES_PASSWORD: gaslance_dev_password
      POSTGRES_DB: gaslance
    ports:
      - "5439:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaslance -d gaslance"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
