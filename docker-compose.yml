version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: gaslance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gaslance
      POSTGRES_PASSWORD: gaslance_dev_password
      POSTGRES_DB: gaslance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaslance -d gaslance"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NestJS Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gaslance-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gaslance:gaslance_dev_password@postgres:5432/gaslance
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
      # Add your keys here or use .env file
      MAINNET_RPC_URL: ${MAINNET_RPC_URL}
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    ports:
      - "3001:3001"

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gaslance-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"

volumes:
  postgres_data:
